name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days (well within Supabase's 7-day inactivity pause threshold)
    - cron: '0 0 */3 * *'
  workflow_dispatch:
    # Allows manual one-click triggering anytime from the GitHub Actions tab

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Keep-Alive Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/keep-alive.js
